name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Testes
        run: python -m pytest -q
      - name: Verificar ambiente
        run: python scripts/check_env.py

  studio-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clonestudio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checagem de sintaxe
        run: npm run check
      - name: Testes do CloneStudio
        run: npm test
